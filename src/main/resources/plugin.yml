name: HopeCraft
main: org.hopestudio.hopeCraft.HopeCraft
version: ${project.version}
api-version: "26.2"
commands:
  hopecraft:
    description: 打开HopeCraft主菜单
    usage: /hopecraft
    permission: hopecraft.use
  skull:
    description: 获取玩家头颅
    usage: /skull [玩家名]
  birthday:
    description: 生日相关命令
    usage: /birthday <set|confirm|broadcast>

  motd:
    description: 修改服务器MOTD（每日消息）
    usage: /motd [新内容]

  suicide:
    description: 结束自己的生命
    usage: /suicide
  heal:
    description: 恢复生命值与饱食度
    usage: /heal
    permission: hopecraft.heal
  feed:
    description: 恢复饱食度
    usage: /feed
    permission: hopecraft.feed
permissions:
  hopecraft.use:
    description: 允许打开HopeCraft主菜单（普通玩家）
    default: false  # 通过 LuckPerms 的 default 组显式授予
  hopecraft.admin:
    description: HopeCraft管理员权限
    default: op  # 仅OP默认拥有此权限
    # 明确MOTD权限继承关系
    children:
      hopecraft.motd: true

  hopecraft.motd:
    description: 允许修改服务器MOTD
    default: false  # 默认关闭，需通过hopecraft.admin继承或单独分配

  hopecraft.heal:
    description: 允许使用 /heal 恢复生命与饱食度
    default: op
  hopecraft.feed:
    description: 允许使用 /feed 恢复饱食度
    default: op